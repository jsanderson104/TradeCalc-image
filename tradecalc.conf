# This NGINX config file is NOT to be used for the container image build. This configuration file is for the external NGINX reverse-proxy that we're using to proxy external connections to various IP's and ports that are exposed as "Service IPs" on the k8s cluster.
# In other words, this coinfguration file should exist on a nginx server that sits "in-front/outside" of the K8S cluster and is used to "direct traffic"
# tradecalc.lab.sanderson.com is registered as 192.168.1.223 from MetalLB to my IDM DNS server

server {
    listen 80;
    server_name tradecalc.lab.sanderson.com; # Replace with your domain name or public IP if applicable

    location / {
        # Forward the requests to the container on host port 8080
        proxy_pass http://192.168.1.223:9090;

        # Standard headers to preserve the client's original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Support WebSockets if your container uses them
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 192.168.1.223:9090

    # SSL Certificate Paths (Update these to match your certificate paths)
    ssl_certificate /etc/nginx/certs/tradecalc.crt;
    ssl_certificate_key /etc/nginx/certs/tradecalc.key;

    # Recommended Security Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy Configuration
    location / {
        # Change this to your app's actual backend port or container name
        proxy_pass http://192.168.1.44:8080;

        # Forward Essential Client Headers (Crucial for apps to know real visitor info)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Optional, uncomment if your app uses WebSockets)
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}

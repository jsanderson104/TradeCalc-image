---
apiVersion: v1
kind: Namespace
metadata:
  name: custom-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-nginx-deployment
  namespace: custom-nginx
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: docker.io/jsanderson104/stuff:my-nginx
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: custom-image-svc
  namespace: custom-nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090

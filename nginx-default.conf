# This file should be placed in the container during image build time, its destination should be /etc/nginx/conf.d/default.conf
server {
    listen       9090;
    listen  [::]:9090;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

location ~ \.php$ {
        try_files $uri =404;

        # Ensure this matches your installed PHP version socket path or nginx will fail to execute PHP and treat the php files as downloadable objects.
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;  # This path was modified to fit the nginx container. After executing "/etc/init.d/php-fpm8.4 start" use netstat -anp |grep sock" to find the path.
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }


}
